version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.1
  aws_assume_role: lbh-hackit/aws_assume_role@0.1.0
  node: circleci/node@7.2.1

executors:
  docker-python:
    docker:
      - image: cimg/python:3.14
  docker-terraform:
    docker:
      - image: "hashicorp/terraform:light"
  docker-dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
  docker-node:
    docker:
      - image: cimg/node:20.19

references:
  workspace_root: &workspace_root "~"
  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

commands:
  assume-role-and-persist-workspace:
    description: "Assumes deployment role and persists credentials across jobs"
    parameters:
      aws-account:
        type: string
    steps:
      - checkout
      - aws_assume_role/assume_role:
          account: <<parameters.aws-account>>
          profile_name: default
          role: "LBH_Circle_CI_Deployment_Role"
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
  preview-terraform:
    description: "Previews terraform state changes"
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          name: Initialize Terraform
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init
      - run:
          name: Preview Terraform changes
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform plan
  terraform-init-then-apply:
    description: "Initializes and applies terraform configuration"
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init
          name: get and init
      - run:
          name: apply
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform apply -auto-approve
  remove-serverless-stack:
    description: "Removes a Serverless stack without creating deployment artifacts"
    parameters:
      stage:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          name: Install Serverless Framework v4
          command: sudo npm install --global serverless@4
      - run:
          name: Remove Serverless stack
          no_output_timeout: 45m
          command: |
            cd ./TokenAdministrationApi/
            serverless remove --config serverless.teardown.yml --stage <<parameters.stage>> --region eu-west-2
  terraform-destroy-plan:
    description: "Creates a Terraform destroy plan for review"
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          name: Create destroy plan
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init
            echo "Resources currently in state:"
            terraform state list
            echo "Destroying this state also deletes /platform-apis-jump-box-pem-key and /platform-apis-jump-box-instance-name if they are still managed here. The database module skips a final snapshot."
            terraform plan -destroy -input=false -out=destroy.plan
            mkdir -p ~/destroy-plan
            cp destroy.plan ~/destroy-plan/destroy.plan
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
            - destroy-plan/destroy.plan
  terraform-destroy:
    description: "Applies the reviewed Terraform destroy plan"
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          name: Destroy Terraform resources
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init
            terraform apply -auto-approve ~/destroy-plan/destroy.plan
  deploy-lambda:
    description: "Deploys API via Serverless"
    parameters:
      stage:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - setup_remote_docker
      - node/install
      - run:
          name: Install serverless CLI
          command: npm i -g serverless
      - run:
          name: Build lambda
          command: |
            cd ./TokenAdministrationApi/
            chmod +x ./build.sh
            ./build.sh
      - run:
          name: Deploy lambda
          command: |
            cd ./TokenAdministrationApi/
            sls deploy --stage <<parameters.stage>> --conceal


  migrate-database:
    description: "Migrate database"
    parameters:
      stage:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - setup_remote_docker
      - run:
          name: Install SSH client
          command: apt-get update && apt-get install -y openssh-client
      - run:
          name: Install Unzip
          command: apt-get update && apt-get install unzip
      - run:
          name: Install AWS CLI
          command: |
            curl -L -o awscliv2.zip "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
            unzip awscliv2.zip
            ./aws/install
      - run:
          name: Install Session Manager plugin
          command: |
            curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
            dpkg -i session-manager-plugin.deb
      - run:
          name: Install dotnet ef core
          command: dotnet tool install dotnet-ef --version 8.0.11 --tool-path ./dotnet-ef-local/
      - run:
          name: Install postgresql client
          command: apt-get install -y postgresql-client
      - run:
          name: SSH into RDS and migrate database
          command: |
            aws ssm get-parameter --name "/platform-apis-jump-box-pem-key" --output text --query Parameter.Value > ./private-key.pem
            chmod 400 ./private-key.pem
            HOST=$(aws ssm get-parameter --name /api-auth-token-generator/<<parameters.stage>>/postgres-hostname --query Parameter.Value)
            PORT=$(aws ssm get-parameter --name /api-auth-token-generator/<<parameters.stage>>/postgres-port --query Parameter.Value)
            INSTANCE_NAME=$(aws ssm get-parameter --name /platform-apis-jump-box-instance-name --query Parameter.Value)
            ssh -4 -i ./private-key.pem -Nf -M -L 5432:${HOST//\"}:${PORT//\"} -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" -o ProxyCommand="aws ssm start-session --target %h --document AWS-StartSSHSession --parameters portNumber=%p --region=eu-west-2" ec2-user@${INSTANCE_NAME//\"}
            PASSWORD=$(aws ssm get-parameter --name /api-auth-token-generator/<<parameters.stage>>/postgres-password --query Parameter.Value)
            USERNAME=$(aws ssm get-parameter --name /api-auth-token-generator/<<parameters.stage>>/postgres-username --query Parameter.Value)
            DATABASE=$(aws ssm get-parameter --name /api-auth-token-generator/<<parameters.stage>>/postgres-database --query Parameter.Value)
            DOTNET_CONN_STR="Host=localhost;Password=${PASSWORD};Port=5432;Username=${USERNAME};Database=${DATABASE}"
            cd ./TokenAdministrationApi/
            CONNECTION_STRING=${DOTNET_CONN_STR} ./../dotnet-ef-local/dotnet-ef database update
            echo "Migration complete."

jobs:
  check-code-formatting:
    executor: docker-dotnet
    steps:
      - checkout
      - run:
          name: Install dotnet format
          command: dotnet tool install dotnet-format --tool-path ./dotnet-format-local/
      - run:
          name: Run formatter check
          command: ./dotnet-format-local/dotnet-format --check
  build-and-test:
    executor: docker-python
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: build
          command: docker-compose build token-administration-api-test
      - run:
          name: Run tests
          command: docker-compose run token-administration-api-test
  assume-role-development:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_DEVELOPMENT
  assume-role-staging:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_STAGING
  assume-role-production:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_PRODUCTION
  assume-role-pre-production:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_PRE_PRODUCTION
  preview-terraform-development:
    executor: docker-terraform
    steps:
      - preview-terraform:
          environment: "development"
  preview-terraform-staging:
    executor: docker-terraform
    steps:
      - preview-terraform:
          environment: "staging"
  preview-terraform-production:
    executor: docker-terraform
    steps:
      - preview-terraform:
          environment: "production"
  terraform-init-and-plan-pre-production:
    executor: docker-terraform
    steps:
      - preview-terraform:
          environment: "pre-production"
  terraform-init-and-apply-to-development:
    executor: docker-terraform
    steps:
      - terraform-init-then-apply:
          environment: "development"
  terraform-init-and-apply-to-staging:
    executor: docker-terraform
    steps:
      - terraform-init-then-apply:
          environment: "staging"
  terraform-init-and-apply-to-production:
    executor: docker-terraform
    steps:
      - terraform-init-then-apply:
          environment: "production"
  terraform-apply-pre-production:
    executor: docker-terraform
    steps:
      - terraform-init-then-apply:
          environment: "pre-production"
  remove-serverless-pre-production:
    executor: docker-node
    steps:
      - remove-serverless-stack:
          stage: "pre-production"
  terraform-destroy-plan-pre-production:
    executor: docker-terraform
    steps:
      - terraform-destroy-plan:
          environment: "pre-production"
  disable-rds-deletion-protection-pre-production:
    executor: docker-python
    steps:
      - *attach_workspace
      - run:
          name: Install AWS CLI
          command: |
            sudo apt-get update
            sudo apt-get install -y unzip
            curl -L -o awscliv2.zip "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
            unzip awscliv2.zip
            sudo ./aws/install
            aws --version
      - run:
          name: Disable RDS deletion protection
          no_output_timeout: 20m
          command: |
            set -eu
            REGION=eu-west-2
            echo "DB instances in this account:"
            aws rds describe-db-instances --region "$REGION" --query "DBInstances[].DBInstanceIdentifier" --output text
            IDS=$(aws rds describe-db-instances --region "$REGION" --query "DBInstances[?contains(DBInstanceIdentifier, 'auth-token-generator')].DBInstanceIdentifier" --output text)
            if [ -z "$IDS" ] || [ "$IDS" = "None" ]; then
              echo "No auth-token-generator database found."
              exit 1
            fi
            COUNT=$(printf '%s\n' "$IDS" | wc -w)
            if [ "$COUNT" -ne 1 ]; then
              echo "Expected exactly one auth-token-generator database, found: $IDS"
              exit 1
            fi
            echo "Disabling deletion protection on $IDS"
            aws rds modify-db-instance --region "$REGION" --db-instance-identifier "$IDS" --no-deletion-protection --apply-immediately
            aws rds wait db-instance-available --region "$REGION" --db-instance-identifier "$IDS"
            PROT=$(aws rds describe-db-instances --region "$REGION" --db-instance-identifier "$IDS" --query "DBInstances[0].DeletionProtection" --output text)
            echo "DeletionProtection=$PROT"
            if [ "$PROT" != "False" ]; then
              echo "Deletion protection is still enabled."
              exit 1
            fi
  release-lambda-enis-pre-production:
    executor: docker-python
    steps:
      - *attach_workspace
      - checkout
      - run:
          name: Install AWS CLI
          command: |
            sudo apt-get update
            sudo apt-get install -y unzip
            curl -L -o awscliv2.zip "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
            unzip awscliv2.zip
            sudo ./aws/install
            aws --version
      - run:
          name: Release Lambda ENIs blocking security group deletion
          no_output_timeout: 10m
          command: python3 scripts/teardown/release-lambda-enis.py --timeout-seconds 300
  terraform-destroy-pre-production:
    executor: docker-terraform
    steps:
      - terraform-destroy:
          environment: "pre-production"
  deploy-to-development:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: "development"
  deploy-to-staging:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: "staging"
  deploy-to-production:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: "production"
  deploy-to-pre-production:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: "pre-production"
  migrate-database-development:
    executor: docker-dotnet
    steps:
      - migrate-database:
          stage: "development"
  migrate-database-staging:
    executor: docker-dotnet
    steps:
      - migrate-database:
          stage: "staging"
  migrate-database-production:
    executor: docker-dotnet
    steps:
      - migrate-database:
          stage: "production"
  migrate-database-pre-production:
    executor: docker-dotnet
    steps:
      - migrate-database:
          stage: "pre-production"

workflows:
  feature:
    jobs:
      - check-code-formatting:
          filters:
            branches:
              ignore: [ development, master, feat/ssi-1369-teardown-pre-production ]
      - build-and-test:
          requires: [ check-code-formatting ]
      - assume-role-development:
          context: api-assume-role-development-context
          filters:
            branches:
              ignore: [ development, master, feat/ssi-1369-teardown-pre-production ]
      - preview-terraform-development:
          requires: [ assume-role-development ]
      - assume-role-staging:
          context: api-assume-role-staging-context
          filters:
            branches:
              ignore: [ development, master, feat/ssi-1369-teardown-pre-production ]
      - preview-terraform-staging:
          requires: [ assume-role-staging ]
      - assume-role-production:
          context: api-assume-role-production-context
          filters:
            branches:
              ignore: [ development, master, feat/ssi-1369-teardown-pre-production ]
      - preview-terraform-production:
          requires: [ assume-role-production ]

  deploy-infrastructure:
    jobs:
      - deploy-development-infrastructure:
          type: approval
          filters:
            branches:
              only: development
      - assume-role-development:
          context: api-assume-role-development-context
          requires: [ deploy-development-infrastructure ]
      - preview-terraform-development:
          requires: [ assume-role-development ]
      - permit-terraform-deployment-to-development:
          type: approval
          requires: [ preview-terraform-development ]
      - terraform-init-and-apply-to-development:
          requires: [ permit-terraform-deployment-to-development ]
      - deploy-staging-infrastructure:
          type: approval
          filters:
            branches:
              only: master
      - assume-role-staging:
          context: api-assume-role-staging-context
          requires: [ deploy-staging-infrastructure ]
      - preview-terraform-staging:
          requires: [ assume-role-staging ]
      - permit-terraform-deployment-to-staging:
          type: approval
          requires: [ preview-terraform-staging ]
      - terraform-init-and-apply-to-staging:
          requires: [ permit-terraform-deployment-to-staging ]
      - deploy-production-infrastructure:
          type: approval
          filters:
            branches:
              only: master
      - assume-role-production:
          context: api-assume-role-production-context
          requires: [ deploy-production-infrastructure ]
      - preview-terraform-production:
          requires: [ assume-role-production ]
      - permit-terraform-deployment-to-production:
          type: approval
          requires: [ preview-terraform-production ]
      - terraform-init-and-apply-to-production:
          requires: [ permit-terraform-deployment-to-production ]
      

  deploy-api-code:
    jobs:
      - check-code-formatting:
          filters:
            branches:
              only: development
      - build-and-test:
          name: "Build and test development"
          filters:
            branches:
              only: development
      - start-development-deployment:
          type: approval
          requires: [ "Build and test development" ]
      - assume-role-development:
          context: api-assume-role-development-context
          requires: [ start-development-deployment ]
      # - migrate-database-development:
      #     requires: [ assume-role-development ]
      - deploy-to-development:
          context: [ "Serverless Framework" ]
          requires: [ assume-role-development ]
      - build-and-test:
          name: "Build and test master"
          filters:
            branches:
              only: master
      - start-staging-deployment:
          type: approval
          requires: [ "Build and test master" ]
      - assume-role-staging:
          context: api-assume-role-staging-context
          requires: [ start-staging-deployment ]
      # - migrate-database-staging:
      #     requires: [ assume-role-staging ]
      - deploy-to-staging:
          context: [ "Serverless Framework" ]
          requires: [ assume-role-staging ]
      - start-production-release:
          type: approval
          requires: [ deploy-to-staging ]
      - assume-role-production:
          context: api-assume-role-production-context
          requires: [ start-production-release ]
      # - migrate-database-production:
      #     requires: [ assume-role-production ]
      - deploy-to-production:
          context: [ "Serverless Framework" ]
          requires: [ assume-role-production ]

  deploy-terraform-pre-production:
    jobs:
      - permit-pre-production-terraform-workflow:
          type: approval
          filters:
            branches:
              only: master
      - assume-role-pre-production:
          context: api-assume-role-housing-pre-production-context
          requires:
            - permit-pre-production-terraform-workflow
          filters:
            branches:
              only: master
      - terraform-init-and-plan-pre-production:
          requires:
            - assume-role-pre-production
          filters:
            branches:
              only: master
      - permit-pre-production-terraform-deployment:
          type: approval
          requires:
            - terraform-init-and-plan-pre-production
          filters:
            branches:
              only: master
      - terraform-apply-pre-production:
          requires:
            - permit-pre-production-terraform-deployment
          filters:
            branches:
              only: master
  deploy-code-pre-production:
    jobs:
      - permit-pre-production-code-workflow:
          type: approval
          filters:
            branches:
              only: master
      - build-and-test:
          requires:
            - permit-pre-production-code-workflow
          filters:
            branches:
              only: master
      - assume-role-pre-production:
          context: api-assume-role-housing-pre-production-context
          requires:
            - build-and-test
          filters:
            branches:
              only: master
      - migrate-database-pre-production:
          requires:
            - assume-role-pre-production
          filters:
            branches:
              only: master
      - deploy-to-pre-production:
          context:
            - "Serverless Framework"
          requires:
            - migrate-database-pre-production
          filters:
            branches:
              only: master

  teardown-pre-production:
    jobs:
      - assume-role-pre-production:
          context: api-assume-role-housing-pre-production-context
          filters:
            branches:
              only: feat/ssi-1369-teardown-pre-production
      - remove-serverless-pre-production:
          context: "Serverless Framework"
          requires:
            - assume-role-pre-production
          filters:
            branches:
              only: feat/ssi-1369-teardown-pre-production
      - terraform-destroy-plan-pre-production:
          requires:
            - remove-serverless-pre-production
          filters:
            branches:
              only: feat/ssi-1369-teardown-pre-production
      - permit-pre-production-terraform-destroy:
          type: approval
          requires:
            - terraform-destroy-plan-pre-production
          filters:
            branches:
              only: feat/ssi-1369-teardown-pre-production
      - disable-rds-deletion-protection-pre-production:
          requires:
            - permit-pre-production-terraform-destroy
          filters:
            branches:
              only: feat/ssi-1369-teardown-pre-production
      - release-lambda-enis-pre-production:
          requires:
            - permit-pre-production-terraform-destroy
          filters:
            branches:
              only: feat/ssi-1369-teardown-pre-production
      - terraform-destroy-pre-production:
          requires:
            - disable-rds-deletion-protection-pre-production
            - release-lambda-enis-pre-production
          filters:
            branches:
              only: feat/ssi-1369-teardown-pre-production
